<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="description" content="Okenice26 — webový desktop ve stylu Windows 95/98.">
<title>Okenice26 — Windows 95 Desktop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="desktop" class="desktop" tabindex="0" aria-label="Desktop Windows 95">
  <div class="desktop-icons" id="desktop-icons">
    <button class="desktop-icon" data-app="computer" type="button"><span class="icon-art icon-computer" aria-hidden="true"></span><span>My Computer</span></button>
    <button class="desktop-icon" data-app="documents" type="button"><span class="icon-art icon-folder" aria-hidden="true"></span><span>My Documents</span></button>
    <button class="desktop-icon" data-app="network" type="button"><span class="icon-art icon-network" aria-hidden="true"></span><span>Network Neighborhood</span></button>
    <button class="desktop-icon" data-app="recycle" type="button"><span class="icon-art icon-trash" aria-hidden="true"></span><span>Recycle Bin</span></button>
    <button class="desktop-icon" data-app="about" type="button"><span class="icon-art icon-notepad" aria-hidden="true"></span><span>Okenice26</span></button>
  </div>
  <div class="windows-layer" id="windows-layer"></div>

  <div class="context-menu" id="context-menu" hidden>
    <button type="button" data-menu-action="arrange">Arrange Icons</button>
    <button type="button" data-menu-action="refresh">Refresh</button>
    <div class="menu-line"></div>
    <button type="button" data-menu-action="new">New ▸</button>
    <div class="menu-line"></div>
    <button type="button" data-menu-action="properties">Properties</button>
  </div>
</div>

<div class="taskbar" id="taskbar">
  <button class="start-button" id="start-button" type="button" aria-expanded="false" aria-controls="start-menu"><span class="windows-flag" aria-hidden="true"></span><strong>Start</strong></button>
  <div class="taskbar-divider" aria-hidden="true"></div>
  <div class="quick-launch" aria-label="Quick Launch">
    <button type="button" class="quick-button" data-app="computer" aria-label="My Computer"><span class="mini-icon computer-mini"></span></button>
    <button type="button" class="quick-button" data-app="documents" aria-label="My Documents"><span class="mini-icon folder-mini"></span></button>
  </div>
  <div class="task-buttons" id="task-buttons" aria-label="Open windows"></div>
  <div class="tray"><span class="speaker" aria-hidden="true"></span><span class="tray-clock" id="clock">12:00</span></div>

  <div class="start-menu" id="start-menu" hidden>
    <div class="start-brand"><span class="brand-flag"></span><span><strong>Windows</strong><b>98</b></span></div>
    <div class="start-content">
      <div class="start-column">
        <button type="button" data-app="computer"><span class="menu-icon computer-mini"></span><span>My Computer</span></button>
        <button type="button" data-app="documents"><span class="menu-icon folder-mini"></span><span>My Documents</span></button>
        <button type="button" data-app="network"><span class="menu-icon network-mini"></span><span>Network Neighborhood</span></button>
        <button type="button" data-app="recycle"><span class="menu-icon trash-mini"></span><span>Recycle Bin</span></button>
      </div>
      <div class="start-column">
        <button type="button" data-app="about"><span class="menu-icon notepad-mini"></span><span>Okenice26</span></button>
        <button type="button" data-app="notepad"><span class="menu-icon notepad-mini"></span><span>Notepad</span></button>
        <button type="button" data-app="internet"><span class="menu-icon ie-mini"></span><span>Internet Explorer</span></button>
        <div class="menu-line"></div>
        <button type="button" data-menu-action="run"><span class="menu-icon run-mini"></span><span>Run...</span></button>
      </div>
    </div>
    <div class="start-footer">
      <button type="button" data-menu-action="shutdown"><span class="menu-icon shutdown-mini"></span><span>Shut Down...</span></button>
    </div>
  </div>
</div>

<div class="shutdown-overlay" id="shutdown-overlay" hidden>
  <div class="shutdown-dialog">
    <div class="dialog-title">Shut Down Windows</div>
    <div class="dialog-body">
      <div class="shutdown-icon">⏻</div>
      <div><strong>What do you want the computer to do?</strong><label><input type="radio" name="shutdown" checked> Shut down</label><label><input type="radio" name="shutdown"> Restart</label><label><input type="radio" name="shutdown"> Stand by</label></div>
    </div>
    <div class="dialog-actions"><button type="button" id="shutdown-cancel">Cancel</button><button type="button" id="shutdown-ok">OK</button></div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
