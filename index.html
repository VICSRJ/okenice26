<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<title>Okenice26</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/95css@0.4.2/css/95css.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="start-panel" aria-label="Hlavní panel">
  <button class="start-button" id="start-button" type="button"><span class="start-mark">▰</span><strong>Start</strong></button>
  <div class="panel-divider" aria-hidden="true"></div>
  <div class="panel-title">Okenice26</div>
  <nav class="panel-nav" aria-label="Navigace">
    <a href="#home">Domů</a>
    <a href="#about">O projektu</a>
  </nav>
  <time id="clock" aria-label="Čas"></time>
</header>

<main id="home" class="desktop">
  <section class="window welcome-window" id="about" aria-labelledby="window-title">
    <div class="window-titlebar">
      <span id="window-title">Okenice26</span>
      <div class="window-controls" aria-hidden="true"><button type="button">_</button><button type="button">□</button><button type="button">×</button></div>
    </div>
    <div class="window-body welcome-body">
      <div class="welcome-icon" aria-hidden="true">O</div>
      <div class="welcome-copy">
        <div class="eyebrow">WELCOME</div>
        <h1>Okenice26</h1>
        <p>Jednoduchá retro webová šablona inspirovaná Windows 95.</p>
        <div class="welcome-actions">
          <a class="action-button" href="#about">O projektu</a>
          <button class="action-button" id="continue-button" type="button">Pokračovat</button>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="app.js" defer></script>
</body>
</html>
