<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="description" content="Macroloft Luxffery 26 — Windows 98 style application and folder template.">
<title>Macroloft Luxffery 26 — Windows 98</title>
<link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/0/0b/Windows_95_FOLDER.png">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/0/0b/Windows_95_FOLDER.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="top-taskbar.css">
<link rel="stylesheet" href="shortcut-template.css">
<link rel="stylesheet" href="menu.css">
<link rel="stylesheet" href="enhancements.css">
</head>
<body>
<main id="desktop" class="desktop" tabindex="0" aria-label="Macroloft Luxffery 26 Desktop">
  <div id="desktop-navigation" class="desktop-navigation" hidden>
    <button id="desktop-back" class="desktop-back" type="button" aria-label="Back">◀ Back</button>
    <span id="desktop-path" class="desktop-path">Desktop</span>
  </div>
  <div id="desktop-icons" class="desktop-icons"></div>
  <div id="context-menu" class="context-menu" hidden>
    <button type="button" data-context="arrange">Arrange Icons</button>
    <button type="button" data-context="lineup">Line up Icons</button>
    <button type="button" data-context="refresh">Refresh</button>
    <div class="menu-separator"></div>
    <button type="button" data-context="new">New <span class="submenu-arrow">▶</span></button>
    <div class="menu-separator"></div>
    <button type="button" data-context="properties">Properties</button>
  </div>
</main>

<footer id="taskbar" class="taskbar">
  <button id="start-button" class="start-button" type="button" aria-expanded="false" aria-controls="start-menu"><span class="windows-logo"></span><strong>Start</strong></button>
  <div class="taskbar-divider"></div>
  <nav id="quick-launch" class="quick-launch" aria-label="Quick Launch"></nav>
  <div class="taskbar-divider quick-divider"></div>
  <div class="task-buttons" aria-hidden="true"></div>
  <div class="tray"><span class="tray-status"><span class="tray-speaker"></span></span><time id="clock">12:00 PM</time></div>
  <div id="start-menu" class="start-menu" hidden>
    <div class="start-banner"><span>Macroloft</span><strong>Luxffery 26</strong></div>
    <nav class="start-items" aria-label="Start menu">
      <button class="start-item has-submenu" type="button" data-menu-target="programs"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>P</u>rograms</span><span class="cascade">▶</span></button>
      <button class="start-item has-submenu" type="button" data-menu-target="favorites"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>F</u>avorites</span><span class="cascade">▶</span></button>
      <button class="start-item has-submenu" type="button" data-menu-target="folders"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>D</u>ocuments</span><span class="cascade">▶</span></button>
      <button class="start-item has-submenu" type="button" data-menu-target="settings"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>S</u>ettings</span><span class="cascade">▶</span></button>
      <button class="start-item" type="button"><span class="icon-art icon-folder menu-icon"></span><span class="item-label">F<u>i</u>nd</span></button>
      <button class="start-item" type="button"><span class="icon-art icon-folder menu-icon"></span><span class="item-label">Help</span></button>
      <button class="start-item" type="button"><span class="icon-art icon-folder menu-icon"></span><span class="item-label">Run...</span></button>
      <div class="menu-separator"></div>
      <button class="start-item" type="button"><span class="icon-art icon-folder menu-icon"></span><span class="item-label">Shut Down...</span></button>
    </nav>
    <div class="submenu" data-submenu-panel="programs" hidden></div>
    <div class="submenu" data-submenu-panel="favorites" hidden></div>
    <div class="submenu" data-submenu-panel="folders" hidden></div>
    <div class="submenu" data-submenu-panel="settings" hidden></div>
  </div>
</footer>

<div id="shortcut-modal" class="shortcut-modal" hidden>
  <div class="shortcut-dialog" role="dialog" aria-modal="true" aria-labelledby="shortcut-title">
    <div class="shortcut-titlebar">
      <span class="dialog-windows-mark" aria-hidden="true"></span>
      <span id="shortcut-title">Shortcut Properties</span>
      <button id="shortcut-close" class="shortcut-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="shortcut-body">
      <div class="shortcut-summary">
        <div id="shortcut-preview" class="shortcut-preview"></div>
        <div class="shortcut-heading">
          <strong id="shortcut-name">Shortcut</strong>
          <span id="shortcut-kind">Internet shortcut</span>
        </div>
      </div>
      <div class="shortcut-details">
        <div><span>Name:</span><strong id="shortcut-detail-name"></strong></div>
        <div><span>Target:</span><code id="shortcut-target"></code></div>
        <div><span>Type:</span><span id="shortcut-detail-type"></span></div>
        <div><span>Category:</span><span id="shortcut-category"></span></div>
        <p id="shortcut-description" class="shortcut-description"></p>
      </div>
    </div>
    <div class="shortcut-actions">
      <button id="shortcut-open" class="default-button" type="button">Open</button>
      <button id="shortcut-new-window" type="button">Open in New Window</button>
      <button id="shortcut-copy" type="button">Copy Link</button>
      <button id="shortcut-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<script src="runtime-guard.js" defer></script>
<script src="app.js" defer></script>
<script src="hierarchy-tree.js" defer></script>
</body>
</html>
