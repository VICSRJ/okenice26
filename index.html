<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="description" content="Okenice26 — databáze odkazů a projektů.">
<title>Okenice26</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/95css@0.4.2/css/95css.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="taskbar-top" aria-label="Hlavní navigace">
  <button class="task-start" id="start-button" type="button" aria-expanded="false" aria-controls="start-menu">
    <span class="start-mark">▰</span><strong>Start</strong>
  </button>
  <span class="task-divider" aria-hidden="true"></span>
  <nav class="task-tabs" aria-label="Sekce">
    <a class="task-item is-active" href="#home"><span>⌂</span><b>Domů</b></a>
    <a class="task-item" href="#about"><span>ⓘ</span><b>O projektu</b></a>
  </nav>
  <div class="task-spacer"></div>
  <div class="task-status"><i></i><span>READY</span></div>
  <time id="clock" aria-label="Čas"></time>

  <div class="start-menu" id="start-menu" hidden>
    <div class="menu-heading"><span class="start-mark">▰</span><strong>Okenice26</strong></div>
    <button type="button" data-target="#home">Domů</button>
    <button type="button" data-target="#about">O projektu</button>
    <div class="menu-separator"></div>
    <button type="button" data-action="close">Zavřít menu</button>
  </div>
</header>

<main id="home" class="desktop">
  <section class="window welcome-window" id="about" aria-labelledby="window-title">
    <div class="window-titlebar">
      <span id="window-title">Okenice26 — Link Database</span>
      <div class="window-controls" aria-hidden="true">
        <button type="button">_</button><button type="button">□</button><button type="button">×</button>
      </div>
    </div>
    <div class="window-body welcome-body">
      <div class="welcome-icon" aria-hidden="true">O</div>
      <div class="welcome-copy">
        <div class="eyebrow">LINK DATABASE / 2026</div>
        <h1>Okenice26</h1>
        <p>Jednoduchá databáze odkazů, projektů, referencí a zdrojů.</p>
        <div class="welcome-actions">
          <a class="action-button" href="#about">O projektu</a>
          <button class="action-button" id="continue-button" type="button">Pokračovat</button>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="app.js" defer></script>
</body>
</html>
