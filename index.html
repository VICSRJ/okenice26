<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="description" content="Okenice26 — prázdná desktopová plocha s Windows 95 taskbarem.">
<title>Okenice26</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/95css@0.4.2/css/95css.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="desktop-taskbar" aria-label="Desktop taskbar">
  <button class="task-start" id="start-button" type="button" aria-expanded="false" aria-controls="start-menu">
    <span class="start-mark" aria-hidden="true">▰</span><strong>Start</strong>
  </button>
  <span class="task-divider" aria-hidden="true"></span>
  <button class="task-item is-active" type="button" aria-current="page">
    <span class="task-icon" aria-hidden="true">O</span><b>Okenice26</b>
  </button>
  <div class="task-spacer"></div>
  <div class="task-status"><i></i><span>READY</span></div>
  <time id="clock" aria-label="Čas"></time>

  <div class="start-menu" id="start-menu" hidden>
    <div class="menu-heading"><span class="start-mark" aria-hidden="true">▰</span><strong>Okenice26</strong></div>
    <div class="menu-caption">Desktop</div>
    <div class="menu-separator"></div>
    <button type="button" data-action="close">Zavřít menu</button>
  </div>
</header>

<main id="desktop" class="desktop" aria-label="Prázdná plocha Okenice26"></main>

<script src="app.js" defer></script>
</body>
</html>
