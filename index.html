<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="description" content="Windows 98 style desktop template for links and folders.">
<title>Microsoft Windows 98 — Okenice26</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="top-taskbar.css">
</head>
<body>
<main id="desktop" class="desktop" tabindex="0" aria-label="Windows 98 Desktop">
  <div id="desktop-icons" class="desktop-icons">
    <a class="desktop-icon" href="https://github.com/VICSRJ/okenice26" target="_blank" rel="noopener"><span class="icon-art icon-link"></span><span>Okenice26</span></a>
    <a class="desktop-icon" href="#folders"><span class="icon-art icon-folder"></span><span>My Documents</span></a>
    <a class="desktop-icon" href="#projects"><span class="icon-art icon-folder"></span><span>Projects</span></a>
    <a class="desktop-icon" href="https://www.microsoft.com/" target="_blank" rel="noopener"><span class="icon-art icon-link"></span><span>Internet</span></a>
    <a class="desktop-icon" href="#recycle"><span class="icon-art icon-trash"></span><span>Recycle Bin</span></a>
  </div>
  <div id="context-menu" class="context-menu" hidden>
    <button type="button" data-context="arrange">Arrange Icons</button>
    <button type="button" data-context="lineup">Line up Icons</button>
    <button type="button" data-context="refresh">Refresh</button>
    <div class="menu-separator"></div>
    <button type="button" data-context="new">New <span class="submenu-arrow">▶</span></button>
    <div class="menu-separator"></div>
    <button type="button" data-context="properties">Properties</button>
  </div>
</main>

<footer id="taskbar" class="taskbar">
  <button id="start-button" class="start-button" type="button" aria-expanded="false" aria-controls="start-menu"><span class="windows-logo" aria-hidden="true"></span><strong>Start</strong></button>
  <div class="taskbar-divider" aria-hidden="true"></div>
  <div class="quick-launch" aria-label="Quick Launch">
    <a class="quick-button" href="https://github.com/VICSRJ/okenice26" target="_blank" rel="noopener" aria-label="Okenice26"><span class="icon-art icon-link icon-small"></span></a>
    <a class="quick-button" href="#folders" aria-label="My Documents"><span class="icon-art icon-folder icon-small"></span></a>
  </div>
  <div class="taskbar-divider quick-divider" aria-hidden="true"></div>
  <div class="task-buttons" aria-hidden="true"></div>
  <div class="tray"><span class="tray-status" aria-hidden="true"><span class="tray-speaker"></span></span><time id="clock">12:00 PM</time></div>

  <div id="start-menu" class="start-menu" hidden>
    <div class="start-banner"><span>Microsoft</span><strong>Windows 98</strong></div>
    <div class="start-items">
      <a class="start-item" href="#programs"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>P</u>rograms</span><span class="cascade">▶</span></a>
      <a class="start-item" href="#favorites"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>F</u>avorites</span><span class="cascade">▶</span></a>
      <a class="start-item" href="#folders"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>D</u>ocuments</span><span class="cascade">▶</span></a>
      <a class="start-item" href="#settings"><span class="icon-art icon-folder menu-icon"></span><span class="item-label"><u>S</u>ettings</span><span class="cascade">▶</span></a>
      <a class="start-item" href="#find"><span class="icon-art icon-link menu-icon"></span><span class="item-label">F<u>i</u>nd</span></a>
      <a class="start-item" href="#help"><span class="icon-art icon-link menu-icon"></span><span class="item-label">Help</span></a>
      <a class="start-item" href="#run"><span class="icon-art icon-link menu-icon"></span><span class="item-label">Run...</span></a>
      <div class="menu-separator"></div>
      <a class="start-item" href="#shutdown"><span class="icon-art icon-link menu-icon"></span><span class="item-label">Shut Down...</span></a>
    </div>
    <div class="submenu" data-submenu-panel="programs" hidden>
      <a href="https://github.com/VICSRJ/okenice26" target="_blank" rel="noopener"><span class="icon-art icon-link menu-icon"></span><span>Okenice26</span></a>
      <a href="#projects"><span class="icon-art icon-folder menu-icon"></span><span>Projects</span></a>
      <a href="https://www.microsoft.com/" target="_blank" rel="noopener"><span class="icon-art icon-link menu-icon"></span><span>Internet</span></a>
    </div>
    <div class="submenu" data-submenu-panel="favorites" hidden>
      <a href="https://github.com/VICSRJ/okenice26" target="_blank" rel="noopener"><span class="icon-art icon-link menu-icon"></span><span>Okenice26</span></a>
    </div>
    <div class="submenu" data-submenu-panel="documents" hidden>
      <a href="#folders"><span class="icon-art icon-folder menu-icon"></span><span>My Documents</span></a>
      <a href="#projects"><span class="icon-art icon-folder menu-icon"></span><span>Projects</span></a>
    </div>
    <div class="submenu" data-submenu-panel="settings" hidden>
      <a href="#settings"><span class="icon-art icon-folder menu-icon"></span><span>Settings</span></a>
      <a href="#links"><span class="icon-art icon-link menu-icon"></span><span>Links</span></a>
    </div>
  </div>
</footer>
<script src="app.js" defer></script>
</body>
</html>
