name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source
        run: |
          node tools/validate.mjs
          node --check app.js
          node --check hierarchy-tree.js
          node --check desktop-metadata.js
          node --check runtime-guard.js
          node --check tools/build-static.mjs

      - name: Validate HTML
        run: npx --yes html-validate index.html

      - name: Build static artifact
        run: node tools/build-static.mjs

      - name: Verify artifact
        run: |
          test -s dist/index.html
          test -s dist/data/links.json
          test -f dist/.nojekyll
          test -s dist/build-info.json
          ! find dist -type f -name '*.map' | grep -q .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
